<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Качество воздуха СПб</title>
    <!-- Yandex Maps API -->
    <script src="https://api-maps.yandex.ru/2.1/?apikey=ваш_api_ключ&lang=ru_RU" type="text/javascript"></script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="container header-content">
            <div class="logo">
                <span class="logo-icon">🌿</span>
                <h1>AirQuality SPb</h1>
            </div>
            <div class="user-panel" id="userPanel">
                <!-- Сюда будет вставляться информация о пользователе или кнопка входа -->
                <button class="btn btn-outline" id="loginBtn">Войти</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-container">
        <div class="map-wrapper">
            <div id="map" class="map"></div>
            
            <!-- Info Card (Floating on Mobile, Side on Desktop) -->
            <div class="info-card" id="infoCard">
                <div class="card-header">
                    <h2 id="districtName">Выберите район</h2>
                    <span class="aqi-badge" id="aqiBadge">--</span>
                </div>
                <div class="card-body">
                    <div class="status-text" id="statusText">Загрузка данных...</div>
                    <div class="pollutants-grid">
                        <div class="pollutant-item">
                            <span class="label">PM2.5</span>
                            <span class="value" id="pm25">--</span>
                        </div>
                        <div class="pollutant-item">
                            <span class="label">PM10</span>
                            <span class="value" id="pm10">--</span>
                        </div>
                        <div class="pollutant-item">
                            <span class="label">NO₂</span>
                            <span class="value" id="no2">--</span>
                        </div>
                        <div class="pollutant-item">
                            <span class="label">O₃</span>
                            <span class="value" id="o3">--</span>
                        </div>
                    </div>
                    <div class="last-update">
                        Обновлено: <span id="lastUpdate">--:--</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Auth Modal -->
    <div class="modal-overlay" id="authModal">
        <div class="modal-window">
            <button class="close-modal" id="closeModal">&times;</button>
            
            <div class="modal-tabs">
                <button class="tab-btn active" data-tab="login">Вход</button>
                <button class="tab-btn" data-tab="register">Регистрация</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form active-form">
                <h3>С возвращением!</h3>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" placeholder="example@mail.ru" required>
                </div>
                <div class="input-group">
                    <label>Пароль</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Войти</button>
                
                <div class="divider"><span>или</span></div>
                
                <button type="button" class="btn btn-google btn-full" id="googleLoginBtn">
                    Продолжить с Google
                </button>
                <button type="button" class="btn btn-guest btn-full" id="guestLoginBtn">
                    Войти как гость
                </button>
                <div class="error-msg" id="loginError"></div>
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="auth-form">
                <h3>Создать аккаунт</h3>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="regEmail" placeholder="example@mail.ru" required>
                </div>
                <div class="input-group">
                    <label>Пароль</label>
                    <input type="password" id="regPassword" placeholder="Минимум 6 символов" required minlength="6">
                </div>
                <div class="input-group">
                    <label>Повторите пароль</label>
                    <input type="password" id="regPasswordConfirm" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Зарегистрироваться</button>
                
                <div class="divider"><span>или</span></div>

                <button type="button" class="btn btn-google btn-full" id="googleRegBtn">
                    Продолжить с Google
                </button>
                <div class="error-msg" id="regError"></div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
