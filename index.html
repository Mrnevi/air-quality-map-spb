<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Качество воздуха Санкт-Петербурга</title>
    
    <!-- Шрифты -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Yandex Maps API (Вставьте свой ключ вместо заглушки, если текущий не работает) -->
    <script src="https://api-maps.yandex.ru/2.1/?apikey=4e3b7b8a-9c0d-4f5e-8a1b-2c3d4e5f6a7b&lang=ru_RU" type="text/javascript"></script>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

    <!-- Подключение стилей -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Загрузочный экран -->
    <div id="global-loader" class="loader-overlay">
        <div class="spinner"></div>
        <p class="loader-text">Загрузка карты...</p>
    </div>

    <!-- Шапка -->
    <header>
        <div class="logo"><span>🌿</span> EcoSPb</div>
        <div class="header-actions">
            <div id="auth-trigger" class="btn-icon" title="Войти">👤</div>
            <div id="user-display" class="user-avatar-sm hidden"></div>
        </div>
    </header>

    <!-- Карта -->
    <div id="map-container">
        <div id="map"></div>
        
        <!-- Плавающая панель -->
        <div id="info-panel" class="info-panel">
            <div class="panel-header">
                <div>
                    <div class="district-title" id="panel-district">Район</div>
                    <div class="panel-status" id="panel-status">Загрузка...</div>
                </div>
                <button class="close-panel" onclick="closePanel()">×</button>
            </div>
            <div class="aqi-row">
                <span class="aqi-badge" id="panel-aqi">--</span>
                <span id="panel-desc"></span>
            </div>
            <div class="pollutants-grid">
                <div class="pollutant-item"><span class="pollutant-label">PM2.5</span><span class="pollutant-val" id="val-pm25">--</span></div>
                <div class="pollutant-item"><span class="pollutant-label">PM10</span><span class="pollutant-val" id="val-pm10">--</span></div>
                <div class="pollutant-item"><span class="pollutant-label">NO₂</span><span class="pollutant-val" id="val-no2">--</span></div>
                <div class="pollutant-item"><span class="pollutant-label">O₃</span><span class="pollutant-val" id="val-o3">--</span></div>
            </div>
        </div>
    </div>

    <!-- Модальное окно Авторизации -->
    <div id="auth-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-modal-btn" onclick="toggleAuthModal(false)">×</button>
            <h2 class="modal-title">Вход в систему</h2>
            
            <div class="auth-tabs">
                <div class="auth-tab active" data-tab="login">Вход</div>
                <div class="auth-tab" data-tab="register">Регистрация</div>
            </div>

            <!-- Форма входа -->
            <div id="form-login">
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="login-email" placeholder="name@example.com">
                </div>
                <div class="input-group">
                    <label>Пароль</label>
                    <input type="password" id="login-pass" placeholder="••••••••">
                </div>
                <button class="btn-primary" onclick="handleLogin()">Войти</button>
                <button class="btn-google" onclick="handleGoogleAuth()">
                    Продолжить с Google
                </button>
                <button class="btn-guest" onclick="handleGuest()">Продолжить как гость</button>
                <div id="login-error" class="error-msg"></div>
            </div>

            <!-- Форма регистрации -->
            <div id="form-register" class="hidden">
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="reg-email" placeholder="name@example.com">
                </div>
                <div class="input-group">
                    <label>Пароль</label>
                    <input type="password" id="reg-pass" placeholder="Минимум 6 символов">
                </div>
                <div class="input-group">
                    <label>Повтор пароля</label>
                    <input type="password" id="reg-pass-confirm" placeholder="••••••••">
                </div>
                <button class="btn-primary" onclick="handleRegister()">Зарегистрироваться</button>
                <div id="reg-error" class="error-msg"></div>
            </div>
        </div>
    </div>

    <!-- Подключение скрипта -->
    <script src="script.js"></script>
</body>
</html>
